apiVersion: v1
kind: Secret
metadata:
  name: sfa-dips-secret
type: Opaque
stringData:
  sfa-dips.toml: |
    logFormat = "text"
    verbosity = 2

    workingDir = "/home/enduro/dips"

    xsdDir = "/home/enduro/eCH-0160-1.1"

    retentionPeriod = "0"

    [api]
    listen = ":8080"

    corsOrigin = "*"

    [api.log]
    path = "stdout"

    level = "warn"

    format = "text"

    [api.auth]
    enabled = true

    [[api.auth.oidc]]
    providerURL = "http://keycloak:7470/realms/artefactual"
    clientID = "enduro-s2s"
    skipEmailVerifiedCheck = true

    [persistence]
    driver = "mysql"
    dsn = ""
    migrate = true

    [temporal]
    address = "temporal-frontend.enduro-sdps:7233"
    namespace = "default"
    taskQueue = "sfa-dips"
    maxConcurrentSessions = 1

    [actapro]
    url = ""
    timeout = "10s"
    pollInterval = "1s"
    token = ""

    [actapro.oidc]
    enabled = false
    providerURL = ""
    tokenURL = ""
    clientID = ""
    clientSecret = ""
    username = ""
    password = ""
    scopes = ""
    tokenExpiryLeeway = "30s"
    retryMaxAttempts = 3
    retryInitialInterval = "500ms"
    retryMaxInterval = "2s"
    retryBackoffCoefficient = 2.0

    [amss]
    baseURL = "http://ambox.enduro-sdps:64081"
    username = "test"
    key = "test"

    [bucket]
    endpoint = "http://seaweedfs.enduro-sdps:8333"
    bucket = "storage"
    region = "us-east-1"
    pathStyle = true
    accessKey = "enduro"
    secretKey = "enduro123"
